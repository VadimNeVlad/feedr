server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Container health probe; kept out of the access log.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed files here, so they can be cached forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry point must always be revalidated to pick up new deployments.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (/tag/node.js, /articles/...) fall back to the SPA.
    location / {
        try_files $uri /index.html;
    }
}
