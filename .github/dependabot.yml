version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 10
    # Freshly published versions are the riskiest: compromised releases are usually pulled within days.
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    # A dependency joins the first matching group, so families must come before the catch-all groups.
    # Families have no update-types: their majors arrive as one PR instead of conflicting single bumps.
    groups:
      tiptap:
        patterns: ["@tiptap/*"]
      mui:
        patterns: ["@mui/*", "@emotion/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      redux:
        patterns: ["@reduxjs/toolkit", "react-redux"]
      vite:
        patterns: ["vite", "@vitejs/*"]
      jest:
        patterns: ["jest", "babel-jest", "jest-environment-jsdom", "@types/jest"]
      babel:
        patterns: ["@babel/*"]
      testing-library:
        patterns: ["@testing-library/*"]
      eslint:
        patterns: ["eslint", "eslint-plugin-*", "@typescript-eslint/*"]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    # No cooldown: base image rebuilds are mostly security fixes, and Dependabot security
    # updates do not cover Docker images, so a delay would only keep CI red.
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Stay on the Node LTS line; moving to the next LTS is a deliberate upgrade.
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
